<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Calendrier de l'Avent Chau7</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <a href="accueil.html" class="brand">🎄 Calendrier Chau7 🧦</a>
        <div class="nav-pill-menu">
            <a href="accueil.html">Calendrier</a>
            <a href="classement.html">Classement</a>
            <a href="regles.html">Règles</a>
        </div>
        <div class="nav-right">
            <div class="guest-links">
                <a href="login.html">Connexion</a>
                <a href="register.html" class="btn-register-nav">Inscription</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <h2>🎅 Connexion</h2>
        <p class="subtitle">Accède à ta chaussette et tes points Chau7</p>

        <div id="auth-message" class="alert-box"></div>

        <form id="login-form">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" id="btn-login">Se connecter 🧦</button>
        </form>

        <p class="switch-link">
            Pas encore de compte ? <a href="register.html">S'inscrire</a>
        </p>
    </div>

    <footer>Pré-liste Chau7 — Toulouse INP-ENSEEIHT 🎄🧦</footer>
    <script src="../js/auth.js"></script>
</body>
</html>
