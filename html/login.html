<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Calendrier de l'Avent Chau7</title>
    <link rel="icon" type="image/png" href="../img/site/logo.png">
        <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <nav>
        <a href="accueil.html" class="brand">🎄 Calendrier Chau7 🧦</a>
        <div class="nav-pill-menu">
            <a href="accueil.html">Calendrier</a>
            <a href="classement.html">Classement</a>
            <a href="regles.html">Règles</a>
        </div>
        <div class="nav-right">
            <div id="nav-guest" class="guest-links">
                <a href="login.html">Connexion</a>
                <a href="register.html" class="btn-register-nav">Inscription</a>
            </div>
            <div id="nav-user" class="user-pill" style="display:none;">
                <span>🎅 <strong id="user-pseudo">Joueur</strong> (<span id="user-filiere">-</span>)</span>
                <span>🏆 <strong id="user-points">0</strong> pts 🧦</span>
                <button type="button" id="btn-logout" class="btn-logout">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <h2>🎅 Connexion</h2>
        <p class="subtitle">Accède à ta chaussette et tes points Chau7</p>

                <div id="auth-message" class="alert-box"></div>

        <div id="resend-box" style="display:none; margin-bottom:1rem; text-align:center;">
            <p style="font-size:0.85rem; margin-bottom:0.5rem;">Tu n'as pas reçu le mail de confirmation ?</p>
            <button type="button" id="btn-resend" class="btn-secondary">Renvoyer l'email de confirmation 📧</button>
        </div>

        <form id="login-form">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" required>

                        <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>

            <div style="margin: 1.25rem 0; display: flex; justify-content: center;">
                <div class="cf-turnstile" data-sitekey="0x4AAAAAAGUfAeLekjF_AZCY"></div>
            </div>

            <button type="submit" id="btn-login">Se connecter 🧦</button>
        </form>

                <p class="switch-link">
            Pas encore de compte ? <a href="register.html">S'inscrire</a><br>
            <button type="button" id="btn-forgot-password" class="link-btn">Mot de passe oublié ? 🔑</button>
        </p>
    </div>

    <footer>Calendrier de l'Avent Chau7 🎄🧦</footer>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
