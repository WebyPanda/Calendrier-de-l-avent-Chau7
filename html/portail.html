<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Chau7</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: #0f291c; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .portal-wrapper { background: rgba(255,255,255,0.95); padding: 2rem; border-radius: 25px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        h1 { color: #1f7a4c; font-size: 1.5rem; margin-bottom: 2rem; }
        .portal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .portal-btn { padding: 1rem; border-radius: 15px; text-decoration: none; color: #1f7a4c; font-weight: bold; background: #fffbeb; border: 2px solid #f5b041; display: flex; flex-direction: column; align-items: center; font-size: 0.9rem; }
        .portal-btn span { font-size: 1.5rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="portal-wrapper">
        <h1>🎄 Portail Chau7 🧦</h1>
        <div class="portal-grid">
            <a href="accueil.html" class="portal-btn"><span>📅</span>Calendrier</a>
            <a href="classement.html" class="portal-btn"><span>🏆</span>Classement</a>
            <a href="login.html" class="portal-btn"><span>🎅</span>Login</a>
            <a href="register.html" class="portal-btn"><span>🧦</span>Insc.</a>
        </div>
    </div>
</body>
</html>
