<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Calendrier de l'Avent Chau7</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <a href="accueil.html" class="brand">🎄 Calendrier Chau7 🧦</a>
        <div class="nav-pill-menu">
            <a href="accueil.html">Calendrier</a>
            <a href="classement.html">Classement</a>
            <a href="regles.html">Règles</a>
        </div>
        <div class="nav-right">
            <div id="nav-guest" class="guest-links">
                <a href="login.html">Connexion</a>
                <a href="register.html" class="btn-register-nav">Inscription</a>
            </div>
            <div id="nav-user" class="user-pill" style="display:none;">
                <span>🎅 <strong id="user-pseudo">Joueur</strong> (<span id="user-filiere">-</span>)</span>
                <span>🏆 <strong id="user-points">0</strong> pts 🧦</span>
                <button type="button" id="btn-logout" class="btn-logout">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <h2>🧦 Créer un compte</h2>
        <p class="subtitle">Rejoins la chasse aux points Chau7 à l'N7</p>

        <div id="auth-message" class="alert-box"></div>

        <form id="register-form">
            <div class="row">
                <div>
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" placeholder="Maxime" required>
                </div>
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" placeholder="Dupont" required>
                </div>
            </div>

            <label for="pseudo">Pseudo public (affiché au classement)</label>
            <input type="text" id="pseudo" name="pseudo" placeholder="Maxou3EA" required>

            <label for="filiere">Filière</label>
            <select id="filiere" name="filiere" required>
                <option value="" disabled selected>Choisis ta filière</option>
                <option value="3EA">3EA</option>
                <option value="SN">SN</option>
                <option value="MF2E">MF2E</option>
                <option value="FISA">FISA</option>
                <option value="Autre">Autre</option>
            </select>

            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" placeholder="prenom.nom@etu.inp-toulouse.fr" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" minlength="6" required>

            <button type="submit" id="btn-register">S'inscrire 🎄</button>
        </form>

        <p class="switch-link">
            Déjà inscrit ? <a href="login.html">Se connecter</a>
        </p>
    </div>

    <footer>Pré-liste Chau7 — Toulouse INP-ENSEEIHT 🎄🧦</footer>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
