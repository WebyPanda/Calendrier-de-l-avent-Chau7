<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargement - Calendrier de l'Avent Chau7</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { margin: 0; padding: 0; height: 100vh; background: #0f291c; color: #fff; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* Rideau vert unique */
        .curtain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(135deg, #1f7a4c 0%, #155536 50%, #0f291c 100%);
            z-index: 1000;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            border-left: 10px solid #f5b041;
            border-right: 10px solid #f5b041;
        }
        
        

        body.open-curtains .curtain { transform: scaleX(0); }

        .loader-wrapper { text-align: center; z-index: 1001; max-width: 90%; width: 500px; padding: 2rem; transition: opacity 0.6s ease; }
        h1 { font-size: 1.8rem; color: #fde68a; margin-bottom: 0.5rem; }
        .candy-scene { perspective: 600px; margin: 2rem auto; width: 200px; height: 80px; display: flex; justify-content: center; align-items: center; }
        .horizontal-cane-container { width: 180px; height: 30px; animation: spin 3s infinite linear; display: flex; align-items: center; justify-content: space-between; }
        .candy-bar { width: 100%; height: 15px; background: repeating-linear-gradient(45deg, #c82323, #c82323 10px, #fff 10px, #fff 20px); border-radius: 8px; }
        .sock-tip { font-size: 1.5rem; }
        
        @keyframes spin { 100% { transform: rotateX(360deg); } }
        .progress-bar-container { width: 100%; background: rgba(255,255,255,0.2); border-radius: 10px; height: 10px; margin-top: 1.5rem; }
        .progress-bar-fill { height: 100%; width: 0%; background: #f5b041; border-radius: 10px; transition: width 0.2s linear; }
    </style>
</head>
<body>
    <div class="curtain"></div>
    <div class="loader-wrapper" id="loader-wrapper">
        <h1>🎄 Calendrier Chau7 🧦</h1>
        <p id="loading-sentence">Initialisation...</p>
        <div class="candy-scene">
            <div class="horizontal-cane-container">
                <span class="sock-tip">🧦</span>
                <div class="candy-bar"></div>
                <span class="sock-tip">🧦</span>
            </div>
        </div>
        <div class="progress-bar-container"><div class="progress-bar-fill" id="progress-fill"></div></div>
    </div>
    <script>
        const sentences = ["Tricotage en cours...", "Chauffage du vin chaud...", "Chargement des points...", "Remplissage des chaussettes...", "Installation des guirlandes..."];
        document.getElementById('loading-sentence').textContent = sentences[Math.floor(Math.random() * sentences.length)];
        let progress = 0;
        const timer = setInterval(() => {
            progress += 1;
            document.getElementById('progress-fill').style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(timer);
                document.body.classList.add('show-split');
                setTimeout(() => {
                    document.body.classList.add('open-curtains');
                    document.getElementById('loader-wrapper').style.opacity = '0';
                    setTimeout(() => window.location.href = 'html/portail.html', 1200);
                }, 400);
            }
        }, 120);
    </script>
</body>
</html>
