<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Chau7 Noël 🎄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="h-full flex items-center justify-center bg-slate-950 p-4">
    <div class="card-festive rounded-2xl p-6 w-full max-w-sm space-y-4 border-2 border-xmasGold bg-gradient-to-b from-slate-900 to-xmasRedDark text-center">
        <span class="text-5xl block">🎅</span>
        <h2 class="text-xl font-black text-xmasGold" id="auth-form-title">CONNEXION DE NOËL</h2>
        <form id="auth-form" class="space-y-3">
            <div id="pseudo-field-wrapper" class="hidden space-y-1 text-left">
                <label class="text-xs font-bold text-slate-300">Prénom & Nom</label>
                <input type="text" id="auth-pseudo" class="w-full bg-slate-950 border border-xmasGold rounded-xl px-3 py-2 text-sm text-white">
            </div>
            <div class="space-y-1 text-left">
                <label class="text-xs font-bold text-slate-300">Email Étudiant N7</label>
                <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-xmasGold rounded-xl px-3 py-2 text-sm text-white">
            </div>
            <div class="space-y-1 text-left">
                <label class="text-xs font-bold text-slate-300">Mot de passe</label>
                <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-xmasGold rounded-xl px-3 py-2 text-sm text-white">
            </div>
            <button type="submit" class="w-full btn-xmas-gold py-3 rounded-xl text-sm font-bold">Se Connecter 🎄</button>
        </form>
        <button type="button" onclick="toggleAuthMode()" class="text-xs text-xmasGold underline font-bold" id="auth-toggle-btn">Pas encore de compte ?</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
