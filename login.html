<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Calendrier de l'Avent</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK officiel Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <a href="login.html" class="brand">🎄 Calendrier de l'Avent</a>
        <div>
            <a href="login.html">Connexion</a>
            <a href="register.html">Inscription</a>
        </div>
    </nav>

    <div class="container">
        <h2>Connexion</h2>

        <div id="auth-message"></div>

        <form id="login-form">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" id="btn-login">Se connecter</button>
        </form>

        <p class="switch-link">
            Pas encore de compte ? <a href="register.html">S'inscrire</a>
        </p>
    </div>

    <!-- Thomas pourra brancher son script Supabase ici -->
    <script src="auth.js"></script>
</body>
</html>
